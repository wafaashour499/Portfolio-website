<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Alwafa Ashour — Data Analyst</title>

<style>
:root{--navy:#0f1d3a;--navy2:#1b2e57;--blue:#3b82f6;--sky:#9cc3ff;--text:#eef2fb;--mute:#aab6d1}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--navy)}
body{min-height:100vh;min-height:100dvh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);
  background:radial-gradient(120% 60% at 50% 0%,#23407a 0%,var(--navy) 60%);
  padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:flex;justify-content:center}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center}
.photo{width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid var(--blue);background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.35)}
h1{font-size:1.65rem;margin-top:14px;letter-spacing:-.4px}
.role{color:var(--sky);font-weight:600;margin-top:4px}
.tag{color:var(--mute);font-size:.88rem;margin:8px 0 22px;text-align:center;line-height:1.45}
.btn{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:14px 18px;border-radius:14px;text-decoration:none;color:var(--text);
  background:var(--navy2);border:1px solid rgba(156,195,255,.18);font-weight:600;font-size:1rem;margin-bottom:12px;transition:transform .12s,background .12s}
.btn:active{transform:scale(.98)}
.btn svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn small{display:block;font-weight:400;font-size:.76rem;opacity:.8;margin-top:2px}
.btn.primary{background:linear-gradient(135deg,#3b82f6,#2563eb);border:0;min-height:68px;font-size:1.1rem;box-shadow:0 8px 22px rgba(59,130,246,.4)}
.btn.li{background:#0a66c2;border:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:12px}
.row .btn{flex-direction:column;justify-content:center;gap:6px;margin:0;text-align:center;min-height:76px;font-size:.92rem;font-weight:500}
.btn.save{background:transparent;border:1.5px dashed var(--sky);color:var(--sky);justify-content:center;margin-top:6px}
footer{margin-top:18px;color:var(--mute);font-size:.78rem}
@media(hover:hover){.btn:hover{background:#27427a}.btn.primary:hover{background:#2f74e6}}
</style>
</head>
<body>
<main>
  <img class="photo" src="photo.jpg" alt="Alwafa Ashour" width="112" height="112">
  <h1>Alwafa Ashour</h1>

  </a>

  <a class="btn li" href="https://linkedin.com/in/alwafa-ashour" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10v7M8 7v.01M12 17v-7M12 13a3 3 0 0 1 6 0v4"/></svg>
    <span>LinkedIn Profile<small>Let’s connect</small></span>

    <a class="btn" href="https://github.com/wafaashour499" target="_blank" rel="noopener">

</html>
